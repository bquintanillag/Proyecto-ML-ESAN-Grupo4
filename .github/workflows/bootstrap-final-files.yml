name: Bootstrap final deliverables

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bootstrap-final-files.yml'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact notebook and PDF
        shell: bash
        run: |
          set -euo pipefail

          # El notebook se dividió en tres fragmentos comprimidos/base64.
          # El orden de estos nombres es intencional para reconstruir los bytes originales.
          cat .bootstrap/exact/nb02.b64 .bootstrap/exact/nb01.b64 .bootstrap/exact/nb00.b64 \
            | base64 -d | gzip -d \
            > Proyecto_Final_ML_Optimizacion_Bayesiana_ESAN_FINAL.ipynb

          cat .bootstrap/exact/pdf00.b64 .bootstrap/exact/pdf01.b64 .bootstrap/exact/pdf02.b64 \
            | base64 -d | gzip -d \
            > Presentacion_Final_ESAN_15min.pdf

          echo "5432590e66a9f19c911a9676aa394e1addd68162a0a15d30ff29dd612facef26  Proyecto_Final_ML_Optimizacion_Bayesiana_ESAN_FINAL.ipynb" | sha256sum -c -
          echo "ac718d261541ed1ff7de6cc5b78fff37361362c2515cc87b09647b53f640846f  Presentacion_Final_ESAN_15min.pdf" | sha256sum -c -

      - name: Commit exact final deliverables and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-final-files.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Agregar notebook y PDF finales exactos"
          git push
